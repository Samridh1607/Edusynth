<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="A glowing open book projecting a neural network hologram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1033"/><stop offset="1" stop-color="#24145a"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ee7ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7c6cff" stop-opacity="0.55"/><stop offset="1" stop-color="#7c6cff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#5ee7ff" stroke-opacity="0.08"/></pattern>
  </defs>
  <style>
    .float { animation: float 5s ease-in-out infinite; }
    .node { transform-box: fill-box; transform-origin: center; animation: node 2.4s ease-in-out infinite; }
    .rise { stroke-dasharray: 4 6; animation: rise 1.2s linear infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes node { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.3); opacity: 1; } }
    @keyframes rise { to { stroke-dashoffset: 20; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="260" fill="url(#bg)"/>
  <rect width="400" height="260" fill="url(#grid)"/>
  <ellipse cx="200" cy="120" rx="150" ry="110" fill="url(#halo)"/>
  <g fill="none" stroke="url(#beam)" stroke-width="2" filter="url(#glow)">
    <path d="M110 200 Q155 180 200 200 Q245 180 290 200 L290 222 Q245 202 200 222 Q155 202 110 222 Z"/>
    <path d="M200 200 V222"/>
    <path class="rise" d="M130 196 L170 70 M270 196 L230 70" stroke-opacity="0.35"/>
  </g>
  <g class="float">
  <g stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1.2" fill="none">
    <path d="M170 70 L200 40 L230 70 L215 110 L185 110 Z M170 70 L215 110 M230 70 L185 110 M200 40 L200 150 M185 110 L160 145 M215 110 L240 145 M160 145 L200 150 L240 145"/>
  </g>
  <g fill="#5ee7ff" filter="url(#glow)">
    <circle class="node" cx="200" cy="40" r="5"/><circle class="node" style="animation-delay:-0.4s" cx="170" cy="70" r="4"/><circle class="node" style="animation-delay:-0.8s" cx="230" cy="70" r="4"/>
    <circle class="node" style="animation-delay:-1.2s" cx="185" cy="110" r="4"/><circle class="node" style="animation-delay:-1.6s" cx="215" cy="110" r="4"/><circle class="node" style="animation-delay:-2s" cx="160" cy="145" r="3.5"/>
    <circle class="node" style="animation-delay:-0.2s" cx="240" cy="145" r="3.5"/><circle class="node" cx="200" cy="150" r="5" fill="#f472b6"/>
  </g>
  </g>
  <g fill="#5ee7ff" fill-opacity="0.6"><circle cx="70" cy="60" r="1.5"/><circle cx="330" cy="50" r="1.5"/><circle cx="345" cy="170" r="1.5"/><circle cx="55" cy="180" r="1.5"/></g>
</svg>
