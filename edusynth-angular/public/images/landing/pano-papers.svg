<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-label="Question fragments assembling into an exam paper beside its answer key">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1033"/><stop offset="0.7" stop-color="#1c1254"/><stop offset="1" stop-color="#2a1563"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ee7ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/><stop offset="1" stop-color="#0b1033" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7c6cff" stop-opacity="0.5"/><stop offset="1" stop-color="#7c6cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="sweep" cx="0" cy="1" r="1"><stop offset="0" stop-color="#5ee7ff" stop-opacity="0.05"/><stop offset="1" stop-color="#5ee7ff" stop-opacity="0.55"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .twinkle { fill: #c7d2fe; animation: twinkle 3s ease-in-out infinite; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .bob { animation: bob 4s ease-in-out infinite; }
    .scan { animation: scan 3.2s ease-in-out infinite alternate; }
    .spin { transform-origin: 1180px 270px; animation: spin 6s linear infinite; }
    .orbit { transform-origin: 1180px 270px; animation: spin 24s linear infinite; }
    .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 2.8s ease-in-out infinite alternate; }
    .draw { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw 3.6s ease-out infinite; }
    .drift { animation: drift 3.6s ease-in infinite; }
    .blink { animation: twinkle 1.4s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(254px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes grow { from { transform: scaleY(0.35); } to { transform: scaleY(1); } }
    @keyframes draw { 0% { stroke-dashoffset: 40; } 35%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes drift { 0% { transform: translateX(-60px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateX(70px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .draw { stroke-dashoffset: 0; } }
  </style>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <g><circle class="twinkle" cx="60" cy="40" r="2" style="animation-delay:-0s"/><circle class="twinkle" cx="180" cy="90" r="1.4" style="animation-delay:-0.7s"/><circle class="twinkle" cx="320" cy="30" r="1.4" style="animation-delay:-1.4s"/><circle class="twinkle" cx="470" cy="70" r="2" style="animation-delay:-2.0999999999999996s"/><circle class="twinkle" cx="610" cy="25" r="1.4" style="animation-delay:-2.8s"/><circle class="twinkle" cx="760" cy="60" r="1.4" style="animation-delay:-0.5s"/><circle class="twinkle" cx="900" cy="35" r="2" style="animation-delay:-1.1999999999999993s"/><circle class="twinkle" cx="1040" cy="80" r="1.4" style="animation-delay:-1.8999999999999995s"/><circle class="twinkle" cx="1190" cy="30" r="1.4" style="animation-delay:-2.5999999999999996s"/><circle class="twinkle" cx="1330" cy="65" r="2" style="animation-delay:-0.2999999999999998s"/><circle class="twinkle" cx="1480" cy="40" r="1.4" style="animation-delay:-1s"/><circle class="twinkle" cx="1560" cy="110" r="1.4" style="animation-delay:-1.6999999999999993s"/><circle class="twinkle" cx="120" cy="180" r="2" style="animation-delay:-2.3999999999999986s"/><circle class="twinkle" cx="700" cy="150" r="1.4" style="animation-delay:-0.09999999999999964s"/><circle class="twinkle" cx="1540" cy="260" r="1.4" style="animation-delay:-0.7999999999999989s"/><circle class="twinkle" cx="40" cy="300" r="2" style="animation-delay:-1.5s"/></g>
  <rect y="440" width="1600" height="160" fill="url(#floor)"/>
  <g stroke="#5ee7ff" stroke-opacity="0.16" fill="none">
    <path d="M0 482H1600 M0 498H1600 M0 520H1600 M0 550H1600 M0 590H1600"/>
    <path d="M800 470 L-1600 600 M800 470 L-800 600 M800 470 L-300 600 M800 470 L100 600 M800 470 L450 600 M800 470 L800 600 M800 470 L1150 600 M800 470 L1500 600 M800 470 L1900 600 M800 470 L2400 600 M800 470 L3200 600"/>
  </g>
  <path d="M0 470H1600" stroke="#f472b6" stroke-opacity="0.5" stroke-width="2" filter="url(#glow)"/>
  <ellipse cx="420" cy="270" rx="420" ry="250" fill="url(#halo)"/>
  <g transform="translate(-60 60) scale(0.8)">
  <g fill="none" stroke="#5ee7ff" stroke-opacity="0.45" stroke-width="2">
    <ellipse cx="420" cy="440" rx="300" ry="26"/><ellipse cx="420" cy="440" rx="210" ry="16"/>
  </g>
  <g fill="#5ee7ff" fill-opacity="0.7" filter="url(#glow)">
    <rect class="drift" x="90" y="150" width="70" height="10" rx="5"/>
    <rect class="drift" style="animation-delay:-1.2s" x="70" y="240" width="90" height="10" rx="5"/>
    <rect class="drift" style="animation-delay:-2.4s" x="100" y="330" width="60" height="10" rx="5"/>
  </g>
  <g transform="rotate(-8 330 270)">
    <rect x="230" y="110" width="200" height="290" rx="14" fill="#5ee7ff" fill-opacity="0.06" stroke="#5ee7ff" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M255 150 H405 M255 190 H375 M255 225 H395 M255 265 H355 M255 300 H390 M255 340 H345 M255 370 H380" stroke="#5ee7ff" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="bob"><g transform="rotate(6 510 290)">
    <rect x="410" y="140" width="200" height="290" rx="14" fill="#0b1033" stroke="#a78bfa" stroke-width="2.5" filter="url(#glow)"/>
    <g fill="none" stroke="#f472b6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path class="draw" d="M435 190 l10 10 l18 -20"/>
      <path class="draw" style="animation-delay:0.6s" d="M435 260 l10 10 l18 -20"/>
      <path class="draw" style="animation-delay:1.2s" d="M435 330 l10 10 l18 -20"/>
      <path class="draw" style="animation-delay:1.8s" d="M435 395 l10 10 l18 -20"/>
    </g>
    <path d="M480 192 H585 M480 262 H570 M480 332 H590 M480 397 H560" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
  </g></g>
  </g>
</svg>
