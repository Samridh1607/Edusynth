<div class="legal-page active">
  <button type="button" class="back-btn" (click)="back()">← Back</button>
  <article class="legal-card" aria-labelledby="legal-heading">
    <div class="legal-card-header">
      <span class="legal-card-header-icon" aria-hidden="true">{{ icon() }}</span>
      <div>
        <h1 id="legal-heading">{{ heading() }}</h1>
        <p>{{ subtitle() }}</p>
      </div>
    </div>
    <div class="legal-card-body" tabindex="0" role="region" [attr.aria-label]="heading() + ' text'">
      <ng-content />
    </div>
  </article>
</div>
