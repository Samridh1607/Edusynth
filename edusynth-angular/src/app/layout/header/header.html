<header class="header">
  <div class="logo-section">
    <div class="logo">EduSynth</div>
    <div class="tagline">Your Pathway to Create Knowledge</div>
  </div>
  <div class="header-right">
    <div class="dropdown">
      <button
        type="button"
        class="dropdown-btn"
        aria-haspopup="true"
        aria-controls="dropdownMenu"
        [attr.aria-expanded]="dropdownOpen()"
        (click)="toggleDropdown()"
      >
        Support <span aria-hidden="true">▼</span>
      </button>
      <div class="dropdown-content" id="dropdownMenu" [class.show]="dropdownOpen()">
        <a href="#" (click)="showSupport('Get support', $event)">1. Get support</a>
        <a href="#" (click)="showSupport('Report an issue', $event)">2. Report an issue</a>
        <a href="#" (click)="showSupport('Share feedback', $event)">3. Share feedback</a>
      </div>
    </div>
    <button
      type="button"
      class="user-info-btn"
      title="User Information"
      aria-label="User information"
      (click)="showUserInfo()"
    >
      U
    </button>
  </div>
</header>
